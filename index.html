<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F1E8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="相冊本本" />
  <title>相冊本本</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg: #F7F1E8;
      --bg-soft: #FBF7F0;
      --panel: #FFFFFF;
      --card: #FFFFFF;
      --card-hover: #FFF9F0;
      --border: #E8DFD0;
      --text: #4A3F35;
      --muted: #9A8B7A;
      --accent: #E8A87C;
      --accent-dark: #D4896A;
      --accent-soft: rgba(232, 168, 124, 0.18);
      --pink: #F2B5C0;
      --pink-soft: rgba(242, 181, 192, 0.2);
      --mint: #A8D5C0;
      --mint-soft: rgba(168, 213, 192, 0.25);
      --danger: #E88B8B;
      --radius: 18px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow: 0 4px 20px rgba(74, 63, 53, 0.06);
      --shadow-sm: 0 2px 10px rgba(74, 63, 53, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      height: auto; min-height: 100%;
      overflow-x: hidden; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100dvh; height: auto;
      max-width: 480px; margin: 0 auto;
      padding: 0 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(100px, env(safe-area-inset-bottom) + 80px);
      overflow-x: hidden; overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      background-image:
        radial-gradient(ellipse at 10% 0%, rgba(242, 181, 192, 0.12) 0%, transparent 45%),
        radial-gradient(ellipse at 90% 20%, rgba(168, 213, 192, 0.1) 0%, transparent 40%);
    }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: linear-gradient(180deg, var(--bg) 70%, transparent);
      padding: 8px 0 6px;
    }
    .title-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px;
    }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(145deg, #E8A87C, #F2B5C0);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-sm);
      border: 2.5px solid #fff;
      overflow: hidden; flex-shrink: 0;
      font-size: 1.25rem;
    }
    .brand h1 {
      font-family: "Zen Maru Gothic", "Noto Sans TC", sans-serif;
      font-size: 1.25rem; font-weight: 700; color: var(--text);
      letter-spacing: 0.02em;
    }
    .brand h1 span { color: var(--accent-dark); }
    .title-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--border);
      background: var(--panel); color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s; font-size: 1rem; box-shadow: var(--shadow-sm);
    }
    .icon-btn:active { transform: scale(0.92); background: var(--card-hover); }

    .cats {
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex-shrink: 0; padding: 7px 14px; border-radius: 999px;
      border: 1.5px solid var(--border); background: var(--panel);
      font-size: 0.8rem; color: var(--muted); cursor: pointer;
      transition: all .15s; white-space: nowrap;
    }
    .cat-chip.active {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
      box-shadow: 0 2px 8px rgba(232, 168, 124, 0.35);
    }
    .cat-chip.add { border-style: dashed; color: var(--accent-dark); }
    .cat-chip.manage { border-style: dashed; color: var(--muted); }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 0 0 10px;
    }
    .toolbar .count { font-size: 0.8rem; color: var(--muted); }
    .toolbar .count strong { color: var(--accent-dark); font-weight: 600; }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin: 0 -2px;
    }
    .photo-item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--bg-soft);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .photo-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .2s;
    }
    .photo-item:active img { transform: scale(1.04); }
    .photo-item .badge-cat {
      position: absolute; bottom: 4px; left: 4px;
      background: rgba(74, 63, 53, 0.72); color: #fff;
      font-size: 0.58rem; padding: 2px 6px; border-radius: 999px;
      backdrop-filter: blur(4px); max-width: 80%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }


    .photo-item .check {
      position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid #fff; background: rgba(0,0,0,.25); display: none;
      align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700;
    }
    body.select-mode .photo-item .check { display: flex; }
    .photo-item.selected .check { background: var(--accent); }
    .photo-item.selected::after {
      content: ''; position: absolute; inset: 0; background: rgba(232,168,124,.28); pointer-events: none;
    }
    body.select-mode .fab { display: none; }
    .select-bar {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
      width: 100%; max-width: 480px; z-index: 50;
      background: var(--panel); border-top: 1.5px solid var(--border);
      padding: 12px 16px max(14px, env(safe-area-inset-bottom));
      display: none; align-items: center; gap: 10px;
      box-shadow: 0 -4px 20px rgba(74,63,53,.08);
    }
    body.select-mode .select-bar { display: flex; }
    .select-bar .sel-count { flex: 1; font-size: .9rem; font-weight: 600; }
    .pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .size-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .size-chip {
      padding: 8px 12px; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--panel); font-size: .78rem; color: var(--muted); cursor: pointer;
    }
    .size-chip.active {
      background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    }
    .upload-preview .thumb .ops {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; background: rgba(0,0,0,.55);
    }
    .upload-preview .thumb .ops button {
      flex: 1; border: none; background: transparent; color: #fff;
      font-size: .7rem; padding: 6px 2px; cursor: pointer;
    }
    #cropModal.modal { justify-content: center; padding: 12px; background: rgba(0,0,0,.85); }
    #cropModal .modal-sheet { max-height: 96dvh; border-radius: 16px; background: #1a1a1a; color: #fff; }
    #cropModal .modal-header { background: #222; border-color: #333; color: #fff; }
    #cropModal .modal-header .close { background: #333; border-color: #444; color: #fff; }
    .crop-stage {
      position: relative; width: 100%; aspect-ratio: 1; background: #000;
      overflow: hidden; border-radius: 8px; touch-action: none;
    }
    .crop-stage img {
      position: absolute; left: 50%; top: 50%; transform-origin: center center;
      max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none;
    }
    .crop-frame {
      position: absolute; inset: 8%; border: 2px solid rgba(255,255,255,.9);
      box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none;
    }
    .crop-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .crop-tools .btn { background: #333; border-color: #555; color: #eee; }

    .empty, .loading {
      text-align: center; padding: 56px 16px; color: var(--muted);
    }
    .empty .emoji { font-size: 2.8rem; margin-bottom: 10px; }
    .loading .spinner {
      width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; margin: 0 auto 12px; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fab {
      position: fixed; right: max(16px, calc(50% - 224px));
      bottom: max(24px, env(safe-area-inset-bottom) + 16px);
      width: 54px; height: 54px; border-radius: 50%;
      background: linear-gradient(145deg, #E8A87C, #F2B5C0); color: #fff;
      border: 3px solid #fff; font-size: 1.6rem;
      box-shadow: 0 6px 20px rgba(232, 168, 124, 0.4);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 45;
    }
    .fab:active { transform: scale(0.94); }

    .toast {
      position: fixed; left: 50%; bottom: max(90px, calc(env(safe-area-inset-bottom) + 70px));
      transform: translateX(-50%) translateY(12px);
      background: rgba(74, 63, 53, 0.92); color: #fff;
      padding: 12px 18px; border-radius: 16px; font-size: 0.88rem;
      box-shadow: 0 10px 28px rgba(74, 63, 53, 0.22);
      opacity: 0; pointer-events: none;
      transition: opacity .28s ease, transform .28s ease;
      z-index: 120; max-width: min(92vw, 360px);
      text-align: center; line-height: 1.45;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { background: rgba(61, 122, 92, 0.95); }
    .toast.err { background: rgba(200, 90, 90, 0.95); }
    .toast.info { background: rgba(74, 63, 53, 0.92); }

    .soft-overlay {
      position: fixed; inset: 0; z-index: 130;
      background: rgba(74, 63, 53, 0.35);
      display: none; align-items: center; justify-content: center;
      padding: 24px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    .soft-overlay.open { display: flex; }
    .soft-card {
      width: 100%; max-width: 320px;
      background: var(--panel); border-radius: 20px;
      padding: 22px 20px 16px;
      box-shadow: 0 16px 48px rgba(74, 63, 53, 0.2);
      border: 1.5px solid var(--border);
      animation: soft-in .22s ease;
    }
    @keyframes soft-in {
      from { opacity: 0; transform: scale(0.94) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .soft-card .soft-icon { font-size: 1.6rem; text-align: center; margin-bottom: 6px; }
    .soft-card .soft-title {
      font-family: "Zen Maru Gothic", sans-serif;
      font-size: 1.05rem; font-weight: 700; text-align: center; margin-bottom: 6px;
    }
    .soft-card .soft-msg {
      font-size: 0.88rem; color: var(--muted); text-align: center;
      line-height: 1.5; margin-bottom: 12px;
    }
    .soft-card .soft-input {
      width: 100%; padding: 11px 13px; border-radius: 10px;
      border: 1.5px solid var(--border); background: var(--bg-soft); color: var(--text);
      font-size: 0.95rem; outline: none; font-family: inherit; margin-bottom: 14px;
    }
    .soft-card .soft-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .soft-actions { display: flex; gap: 10px; }
    .soft-actions .btn { flex: 1; padding: 11px 12px; border-radius: 12px; }

    .btn {
      padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--panel); color: var(--muted); font-size: 0.82rem; cursor: pointer;
      white-space: nowrap; transition: all .15s; font-weight: 500; font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
      box-shadow: 0 3px 12px rgba(232, 168, 124, 0.35);
    }
    .btn.danger { border-color: rgba(232, 139, 139, 0.5); color: var(--danger); }

    .modal {
      position: fixed; inset: 0; z-index: 100; background: rgba(74, 63, 53, 0.45);
      display: none; flex-direction: column; align-items: center; justify-content: flex-end;
      padding-top: env(safe-area-inset-top);
    }
    .modal.open { display: flex; }
    .modal-sheet {
      width: 100%; max-width: 480px; max-height: 92dvh;
      background: var(--bg); border-radius: 24px 24px 0 0;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 -8px 40px rgba(74, 63, 53, 0.15);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; gap: 10px; flex-shrink: 0;
      border-bottom: 1px solid var(--border); background: var(--panel);
    }
    .modal-header .title {
      font-size: 1rem; font-weight: 700; flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      font-family: "Zen Maru Gothic", sans-serif;
    }
    .modal-header .close {
      width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border);
      background: var(--bg-soft); color: var(--text); font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-body {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 16px; display: flex; flex-direction: column; gap: 14px;
    }
    .field { margin-bottom: 4px; }
    .field label {
      display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 5px; font-weight: 500;
    }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 13px; border-radius: var(--radius-xs);
      border: 1.5px solid var(--border); background: var(--bg-soft); color: var(--text);
      font-size: 0.9rem; outline: none; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .field textarea { min-height: 80px; resize: vertical; line-height: 1.5; }

    .file-input-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 22px; border: 2px dashed var(--border); border-radius: var(--radius);
      background: var(--bg-soft); color: var(--muted); font-size: 0.95rem;
      cursor: pointer; transition: all .15s;
    }
    .file-input-btn:active { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); }
    .upload-preview {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px;
    }
    .upload-preview .thumb {
      aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg-soft);
      position: relative; border: 1.5px solid var(--border);
    }
    .upload-preview .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .upload-preview .thumb .rm {
      position: absolute; top: 3px; right: 3px; width: 22px; height: 22px;
      border-radius: 50%; background: var(--danger); color: #fff;
      border: none; font-size: 12px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .progress-wrap {
      background: var(--panel); border-radius: 12px; padding: 12px; display: none;
      border: 1.5px solid var(--border);
    }
    .progress-wrap.show { display: block; }
    .progress-bar {
      height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 8px;
    }
    .progress-bar > div {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--pink));
      width: 0%; transition: width .3s; border-radius: 999px;
    }

    /* Category manage list */
    .cat-list { display: flex; flex-direction: column; gap: 8px; }
    .cat-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 10px 12px;
    }
    .cat-row .name { flex: 1; font-weight: 600; font-size: 0.92rem; }
    .cat-row .count { font-size: 0.75rem; color: var(--muted); margin-right: 4px; }
    .cat-row .act {
      border: none; background: var(--bg-soft); color: var(--muted);
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.85rem;
    }
    .cat-row .act.del { color: var(--danger); }
    .cat-row.locked .act { opacity: 0.3; pointer-events: none; }

    #viewerModal.fullscreen {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      padding: 0; margin: 0; display: none; align-items: stretch; justify-content: stretch;
      overflow: hidden; background: #000; z-index: 9999;
      touch-action: none;
    }
    #viewerModal.fullscreen.open { display: flex; }
    #viewerModal.fullscreen .viewer-inner {
      position: relative; display: flex; flex-direction: column;
      width: 100%; height: 100%; background: #000;
    }
    /* 圖片區：可雙指縮放／拖曳，不擋住上方控制列 */
    #viewerModal.fullscreen .viewer-img-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; touch-action: none;
      z-index: 1;
    }
    #viewerModal.fullscreen .viewer-img-wrap img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
      transform-origin: center center;
      will-change: transform;
      pointer-events: none;
    }
    /* 頂部操作列：永遠在最上層，不會被相片擋住 */
    #viewerModal.fullscreen .viewer-topbar {
      position: absolute; left: 0; right: 0; top: 0; z-index: 20;
      padding: max(10px, env(safe-area-inset-top)) 12px 12px;
      background: linear-gradient(rgba(0,0,0,.72), transparent);
      display: flex; align-items: center; gap: 8px;
      pointer-events: auto;
    }
    #viewerModal.fullscreen .viewer-topbar button {
      min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.4); background: rgba(20,20,20,.75);
      color: #fff; font-size: 0.85rem; font-family: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #viewerModal.fullscreen .viewer-topbar .btn-back {
      width: 44px; height: 44px; padding: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.35rem;
    }
    #viewerModal.fullscreen .viewer-topbar .spacer { flex: 1; }
    #viewerModal.fullscreen .viewer-topbar .btn-del {
      border-color: rgba(232,139,139,.65); color: #ffb0b0;
    }
    /* 底部資訊列 */
    #viewerModal.fullscreen .viewer-bar {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(0,0,0,.78));
      color: #fff; pointer-events: none;
    }
    #viewerModal.fullscreen .viewer-info { font-size: 0.88rem; line-height: 1.45; pointer-events: none; }
    #viewerModal.fullscreen .viewer-info .cat-tag {
      display: inline-block; background: rgba(255,255,255,.2);
      padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; margin-bottom: 4px;
    }
    .viewer-err {
      color: #ccc; text-align: center; padding: 24px; font-size: 0.9rem;
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      z-index: 5; pointer-events: none;
    }

    .settings-panel {
      background: var(--panel); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; display: none; box-shadow: var(--shadow);
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 {
      font-size: 0.88rem; margin-bottom: 12px; color: var(--muted); font-weight: 600;
    }
    .settings-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .status-bar {
      font-size: 0.72rem; color: var(--muted); padding: 0 2px 8px; min-height: 1.1em;
    }
    .status-bar.error { color: var(--danger); }
    .status-bar.ok { color: #5a9e7a; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="title-row">
      <div class="brand">
        <div class="brand-icon">📷</div>
        <h1>相冊<span>本本</span></h1>
      </div>
      <div class="title-actions">
        <button class="icon-btn" id="btnRefresh" title="重新整理">↻</button>
        <button class="icon-btn" id="btnSettings" title="設定">⚙</button>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <h3>☁ Supabase 連線</h3>
      <div class="field">
        <label>Project URL</label>
        <input type="text" value="https://wanknivxcsrasdkkxmfr.supabase.co" readonly />
      </div>

<script>
(function () {

  // ---------- utils ----------
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function toast(msg, ms, type) {
    ms = ms || 2400; type = type || 'info';
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + type;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, ms);
  }

  function softDialog(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      document.getElementById('softIcon').textContent = opts.icon || '❓';
      document.getElementById('softTitle').textContent = opts.title || '確認';
      document.getElementById('softMsg').textContent = opts.msg || '';
      document.getElementById('softOk').textContent = opts.okText || '確定';
      document.getElementById('softCancel').textContent = opts.cancelText || '取消';
      const input = document.getElementById('softInput');
      if (opts.prompt) {
        input.style.display = 'block';
        input.value = opts.value || '';
        input.placeholder = opts.placeholder || '';
        setTimeout(function () { input.focus(); input.select(); }, 50);
      } else {
        input.style.display = 'none';
      }
      const overlay = document.getElementById('softOverlay');
      overlay.classList.add('open');
      function cleanup(val) {
        overlay.classList.remove('open');
        document.getElementById('softOk').onclick = null;
        document.getElementById('softCancel').onclick = null;
        resolve(val);
      }
      document.getElementById('softOk').onclick = function () {
        cleanup(opts.prompt ? input.value : true);
      };
      document.getElementById('softCancel').onclick = function () { cleanup(opts.prompt ? null : false); };
    });
  }

  function softConfirm(msg, opts) {
    opts = opts || {};
    return softDialog({
      msg: msg, title: opts.title || '確認', icon: opts.icon || '❓',
      okText: opts.okText || '確定'
    });
  }

  function softPrompt(msg, opts) {
    opts = opts || {};
    return softDialog({
      msg: msg, title: opts.title || '輸入', icon: opts.icon || '✏️',
      okText: opts.okText || '確定', prompt: true,
      value: opts.value || '', placeholder: opts.placeholder || ''
    });
  }

  function withTimeout(promise, ms) {
    ms = ms || 10000;
    return Promise.race([
      promise,
      new Promise(function (_, reject) {
        setTimeout(function () { reject(new Error('連線逾時（' + (ms / 1000) + 's）')); }, ms);
      })
    ]);
  }

  function cacheSave() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        data: appData, updatedAt: remoteUpdatedAt, savedAt: Date.now()
      }));
    } catch (_) {}
  }

  function cacheLoad() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (_) { return null; }
  }

  // ---------- compress ----------
  function compressImage(file, maxWidth, quality) {
    maxWidth = maxWidth || uploadMaxW || 1600;
    quality = quality || 0.82;
    return new Promise(function (resolve, reject) {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function () {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) {
          h = Math.round(h * maxWidth / w);
          w = maxWidth;
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (blob) resolve(blob);
          else reject(new Error('壓縮失敗'));
        }, 'image/jpeg', quality);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('圖片讀取失敗'));
      };
      img.src = url;
    });
  }

  // ---------- data ----------
  async function loadData() {
    const loadingEl = document.getElementById('loadingState');
    const emptyEl = document.getElementById('emptyState');
    const gridEl = document.getElementById('photoGrid');
    loadingEl.style.display = 'block';
    emptyEl.style.display = 'none';
    gridEl.innerHTML = '';
    loadOk = false;

    const safety = setTimeout(function () {
      loadingEl.style.display = 'none';
    }, 12000);

    try {
      if (!supabase) throw (window.__sbInitError || new Error('Supabase SDK 未載入'));

      const result = await withTimeout(
        Promise.resolve(
          supabase.from('notepad_data').select('data, updated_at').eq('id', DATA_ID).maybeSingle()
        ),
        10000
      );
      const { data, error } = result || {};
      if (error) throw error;

      if (!data) {
        try {
          await withTimeout(
            Promise.resolve(
              supabase.from('notepad_data').upsert({
                id: DATA_ID,
                data: appData,
                updated_at: new Date().toISOString()
              })
            ),
            8000
          );
          remoteUpdatedAt = new Date().toISOString();
        } catch (initErr) {
          console.warn('初始化失敗:', initErr);
        }
      } else {
        const d = data.data || {};
        appData = {
          photos: Array.isArray(d.photos) ? d.photos : [],
          categories: (Array.isArray(d.categories) && d.categories.length)
            ? d.categories
            : DEFAULT_CATS.slice()
        };
        if (!appData.categories.includes('全部')) appData.categories.unshift('全部');
        remoteUpdatedAt = data.updated_at || null;
      }

      loadOk = true;
      cacheSave();
      document.getElementById('statusBar').textContent = '連線正常 · 共 ' + appData.photos.length + ' 張';
      document.getElementById('statusBar').className = 'status-bar ok';
    } catch (err) {
      console.error(err);
      const msg = (err && err.message) ? err.message : String(err);

      // 離線／失敗時用快取唯讀，仍禁止寫入
      const cached = cacheLoad();
      if (cached && cached.data && Array.isArray(cached.data.photos)) {
        appData = {
          photos: cached.data.photos,
          categories: (cached.data.categories && cached.data.categories.length)
            ? cached.data.categories
            : DEFAULT_CATS.slice()
        };
        remoteUpdatedAt = cached.updatedAt || null;
        loadOk = false; // 快取模式禁止寫入，避免覆蓋雲端
        toast('離線快取（唯讀）：' + msg, 4000, 'info');
        document.getElementById('statusBar').textContent = '離線快取 · 禁止寫入';
        document.getElementById('statusBar').className = 'status-bar error';
      } else {
        appData.photos = [];
        appData.categories = DEFAULT_CATS.slice();
        loadOk = false;
        toast('載入失敗：' + msg, 4000, 'err');
        document.getElementById('statusBar').textContent = '連線失敗：' + msg;
        document.getElementById('statusBar').className = 'status-bar error';
      }
    } finally {
      clearTimeout(safety);
      loadingEl.style.display = 'none';
      render();
    }
  }

  async function saveData() {
    if (!loadOk) {
      toast('資料未載入成功，禁止寫入以免覆蓋雲端清單', 4000, 'err');
      throw new Error('not loaded');
    }
    if (!supabase) throw new Error('Supabase 未初始化');

    // 寫入前再讀一次，避免多裝置互相覆蓋
    try {
      const check = await withTimeout(
        Promise.resolve(
          supabase.from('notepad_data').select('updated_at').eq('id', DATA_ID).maybeSingle()
        ),
        8000
      );
      if (check && check.data && check.data.updated_at && remoteUpdatedAt &&
          check.data.updated_at !== remoteUpdatedAt) {
        const ok = await softConfirm(
          '雲端資料已被其他裝置更新。若繼續儲存，可能覆蓋別人剛加的照片。要重新載入嗎？（建議選「重新載入」）',
          { title: '資料衝突', icon: '⚠️', okText: '重新載入' }
        );
        if (ok) {
          await loadData();
          throw new Error('已重新載入，請再操作一次');
        }
        // 使用者堅持覆寫
      }
    } catch (e) {
      if (e && e.message === '已重新載入，請再操作一次') throw e;
      // 檢查失敗不擋寫入，繼續
      console.warn('衝突檢查略過', e);
    }

    const now = new Date().toISOString();
    const { error } = await withTimeout(
      Promise.resolve(
        supabase.from('notepad_data').upsert({
          id: DATA_ID,
          data: appData,
          updated_at: now
        })
      ),
      10000
    );
    if (error) {
      console.error(error);
      toast('儲存失敗：' + error.message, 3500, 'err');
      throw error;
    }
    remoteUpdatedAt = now;
    cacheSave();
  }

  // ---------- upload ----------
  async function doUpload() {
    if (!selectedFiles.length) return;
    if (!loadOk) {
      toast('資料未載入成功，禁止上傳以免覆蓋', 4000, 'err');
      return;
    }
    const cat = document.getElementById('uploadCategory').value || '生活';
    const note = document.getElementById('uploadNote').value.trim();
    const btn = document.getElementById('btnDoUpload');
    const wrap = document.getElementById('progressWrap');
    const bar = document.getElementById('progressBar');
    const txt = document.getElementById('progressText');

    btn.disabled = true;
    wrap.classList.add('show');
    const total = selectedFiles.length;
    let done = 0;
    const newPhotos = [];

    for (let i = 0; i < selectedFiles.length; i++) {
      const item = selectedFiles[i];
      try {
        txt.textContent = '壓縮並上傳 ' + (i + 1) + '/' + total + '…';
        const blob = await compressImage(item.blob || item.file, uploadMaxW);
        const fileName = Date.now() + '_' + Math.random().toString(36).slice(2, 9) + '.jpg';
        const up = await supabase.storage
          .from(BUCKET)
          .upload(fileName, blob, { contentType: 'image/jpeg', upsert: false });
        if (up.error) throw up.error;

        const pub = supabase.storage.from(BUCKET).getPublicUrl(fileName);
        const publicUrl = pub.data.publicUrl;

        newPhotos.push({
          id: (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + i)),
          url: publicUrl,
          path: fileName,
          category: cat,
          note: note,
          created_at: new Date().toISOString()
        });
        done++;
        bar.style.width = Math.round((done / total) * 100) + '%';
      } catch (err) {
        console.error(err);
        toast('上傳失敗：' + ((err && err.message) || err), 3500, 'err');
      }
    }

    if (newPhotos.length) {
      appData.photos = newPhotos.concat(appData.photos);
      try {
        await saveData();
        toast('成功上傳 ' + newPhotos.length + ' 張', 2400, 'ok');
        closeUpload();
        render();
      } catch (e) {
        // 已上傳到 Storage，但 metadata 沒存成功
        toast('圖片已上傳，但清單儲存失敗，請按右上角 ↻ 後再試', 4500, 'err');
      }
    }

    btn.disabled = false;
    wrap.classList.remove('show');
    bar.style.width = '0%';
  }

  async function renameCategory(oldName) {

    if (name === '全部') return;
    const count = appData.photos.filter(function (p) { return p.category === name; }).length;

  // ---------- viewer transform (pinch / pan / rotate) ----------
  var vz = { scale: 1, x: 0, y: 0, rot: 0 };
  var touchState = null; // { mode, startDist, startScale, startX, startY, startTx, startTy, lastTap }

  function applyViewerTransform() {
    var img = document.getElementById('viewerImg');
    if (!img) return;
    img.style.transform =
      'translate(' + vz.x + 'px,' + vz.y + 'px) scale(' + vz.scale + ') rotate(' + vz.rot + 'deg)';
  }

  function resetViewerTransform() {
    vz.scale = 1; vz.x = 0; vz.y = 0; vz.rot = 0;
    applyViewerTransform();
  }

  function touchDist(t1, t2) {
    var dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function touchMid(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }

  function initViewerGestures() {
    var wrap = document.getElementById('viewerImgWrap');
    if (!wrap || wrap._gesturesBound) return;
    wrap._gesturesBound = true;

    wrap.addEventListener('touchstart', function (e) {
      if (!document.getElementById('viewerModal').classList.contains('open')) return;
      if (e.touches.length === 2) {
        e.preventDefault();
        touchState = {
          mode: 'pinch',
          startDist: touchDist(e.touches[0], e.touches[1]),
          startScale: vz.scale,
          startTx: vz.x, startTy: vz.y
        };
      } else if (e.touches.length === 1) {
        var now = Date.now();
        // 雙擊切換 1x / 2.5x
        if (touchState && touchState.lastTap && now - touchState.lastTap < 300) {
          e.preventDefault();
          if (vz.scale > 1.2) {
            vz.scale = 1; vz.x = 0; vz.y = 0;
          } else {
            vz.scale = 2.5;
          }
          applyViewerTransform();
          touchState = { lastTap: 0 };
          return;
        }
        touchState = {
          mode: vz.scale > 1.05 ? 'pan' : 'swipe',
          startX: e.touches[0].clientX,
          startY: e.touches[0].clientY,
          startTx: vz.x, startTy: vz.y,
          lastTap: now,
          moved: false
        };
      }
    }, { passive: false });

    wrap.addEventListener('touchmove', function (e) {
      if (!touchState) return;
      if (touchState.mode === 'pinch' && e.touches.length >= 2) {
        e.preventDefault();
        var d = touchDist(e.touches[0], e.touches[1]);
        var ratio = d / (touchState.startDist || 1);
        vz.scale = Math.min(5, Math.max(1, touchState.startScale * ratio));
        if (vz.scale <= 1.02) { vz.scale = 1; vz.x = 0; vz.y = 0; }
        applyViewerTransform();
      } else if (touchState.mode === 'pan' && e.touches.length === 1 && vz.scale > 1.05) {
        e.preventDefault();
        var dx = e.touches[0].clientX - touchState.startX;
        var dy = e.touches[0].clientY - touchState.startY;
        vz.x = touchState.startTx + dx;
        vz.y = touchState.startTy + dy;
        applyViewerTransform();
        touchState.moved = true;
      } else if (touchState.mode === 'swipe' && e.touches.length === 1) {
        var adx = Math.abs(e.touches[0].clientX - touchState.startX);
        var ady = Math.abs(e.touches[0].clientY - touchState.startY);
        if (adx > 12 || ady > 12) touchState.moved = true;
      }
    }, { passive: false });

    wrap.addEventListener('touchend', function (e) {
      if (e.touches.length < 2 && touchState && touchState.mode === 'pinch') {
        touchState = null;
      }
      if (e.touches.length === 0 && touchState) {
        if (touchState.mode === 'swipe' && touchState.moved && e.changedTouches && e.changedTouches.length) {
          var dx = e.changedTouches[0].clientX - touchState.startX;
          var dy = e.changedTouches[0].clientY - touchState.startY;
          if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.2 && viewerList.length > 1) {
            if (dx < 0) showViewerAt(viewerIndex + 1);
            else showViewerAt(viewerIndex - 1);
          }
        }
        var lt = touchState.lastTap;
        touchState = { lastTap: lt };
      }
    }, { passive: true });

    // 滑鼠滾輪縮放（桌面）
    wrap.addEventListener('wheel', function (e) {
      if (!document.getElementById('viewerModal').classList.contains('open')) return;
      e.preventDefault();
      var delta = e.deltaY > 0 ? -0.15 : 0.15;
      vz.scale = Math.min(5, Math.max(1, vz.scale + delta));
      if (vz.scale <= 1.02) { vz.scale = 1; vz.x = 0; vz.y = 0; }
      applyViewerTransform();
    }, { passive: false });
  }

  function openViewer(photo) {

  function rotateBlob(blob, deg) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var canvas = document.createElement('canvas');
        var rad = (deg % 360) * Math.PI / 180;
        var w = img.width, h = img.height;
        var cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
        canvas.width = Math.round(w * cos + h * sin);
        canvas.height = Math.round(w * sin + h * cos);
        var ctx = canvas.getContext('2d');
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(rad);
        ctx.drawImage(img, -w / 2, -h / 2);
        canvas.toBlob(function (b) {
          if (b) resolve(b); else reject(new Error('旋轉失敗'));
        }, 'image/jpeg', 0.92);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('讀取失敗')); };
      img.src = url;
    });
  }

  function openCrop(i) {
    cropIdx = i;
    var item = selectedFiles[i];
    if (!item) return;
    var img = document.getElementById('cropImg');
    img.onload = function () {
      cropState = { scale: 1, x: 0, y: 0, rot: 0, natW: img.naturalWidth, natH: img.naturalHeight, baseScale: 1 };
      fitCropImage();
    };
    img.src = item.previewUrl;
    document.getElementById('cropModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function fitCropImage() {
    var stage = document.getElementById('cropStage');
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var nw = cropState.natW, nh = cropState.natH;
    if (cropState.rot % 180 !== 0) { var t = nw; nw = nh; nh = t; }
    var fw = sw * 0.84, fh = sh * 0.84;
    cropState.baseScale = Math.max(fw / nw, fh / nh);
    applyCropTransform();
  }
  function applyCropTransform() {
    var img = document.getElementById('cropImg');
    var s = cropState.baseScale * cropState.scale;
    img.style.width = cropState.natW + 'px';
    img.style.height = cropState.natH + 'px';
    img.style.transform = 'translate(-50%,-50%) translate(' + cropState.x + 'px,' + cropState.y + 'px) rotate(' + cropState.rot + 'deg) scale(' + s + ')';
  }
  function closeCrop() {
    document.getElementById('cropModal').classList.remove('open');
    document.body.style.overflow = '';
    cropIdx = -1;
  }
  async function applyCrop() {
    if (cropIdx < 0) return;
    var stage = document.getElementById('cropStage');
    var sw = stage.clientWidth;
    var fw = sw * 0.84;
    var outSize = 1200;
    var canvas = document.createElement('canvas');
    canvas.width = outSize; canvas.height = outSize;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, outSize, outSize);
    var img = document.getElementById('cropImg');
    var s = cropState.baseScale * cropState.scale;
    var k = outSize / fw;
    ctx.save();
    ctx.translate(outSize / 2, outSize / 2);
    ctx.rotate(cropState.rot * Math.PI / 180);
    var drawW = cropState.natW * s * k;
    var drawH = cropState.natH * s * k;
    ctx.drawImage(img, -drawW / 2 + cropState.x * k, -drawH / 2 + cropState.y * k, drawW, drawH);
    ctx.restore();
    var blob = await new Promise(function (resolve, reject) {
      canvas.toBlob(function (b) { if (b) resolve(b); else reject(new Error('裁剪失敗')); }, 'image/jpeg', 0.92);
    });
    if (selectedFiles[cropIdx].previewUrl) URL.revokeObjectURL(selectedFiles[cropIdx].previewUrl);
    selectedFiles[cropIdx].blob = blob;
    selectedFiles[cropIdx].previewUrl = URL.createObjectURL(blob);
    renderPreview();
    closeCrop();
    toast('已套用裁剪', 1800, 'ok');
  }
  (function initCropGestures() {
    var stage = document.getElementById('cropStage');
    if (!stage) return;
    var st = null;
    stage.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        e.preventDefault();
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        st = { mode: 'pinch', dist: Math.sqrt(dx*dx+dy*dy), scale: cropState.scale };
      } else if (e.touches.length === 1) {
        st = { mode: 'pan', x: e.touches[0].clientX, y: e.touches[0].clientY, tx: cropState.x, ty: cropState.y };
      }
    }, { passive: false });
    stage.addEventListener('touchmove', function (e) {
      if (!st) return;
      e.preventDefault();
      if (st.mode === 'pinch' && e.touches.length >= 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var d = Math.sqrt(dx*dx+dy*dy);
        cropState.scale = Math.min(5, Math.max(0.5, st.scale * (d / st.dist)));
        applyCropTransform();
      } else if (st.mode === 'pan' && e.touches.length === 1) {
        cropState.x = st.tx + (e.touches[0].clientX - st.x);
        cropState.y = st.ty + (e.touches[0].clientY - st.y);
        applyCropTransform();
      }
    }, { passive: false });
    stage.addEventListener('touchend', function () { st = null; }, { passive: true });
  })();

  async function addFilesFromInput(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      if (!file.type || file.type.indexOf('image/') !== 0) continue;
      try {
        var blob = await compressImage(file, 2400, 0.92);
        var previewUrl = URL.createObjectURL(blob);
        selectedFiles.push({ file: file, blob: blob, previewUrl: previewUrl });
      } catch (err) {
        toast('處理失敗：' + ((err && err.message) || err), 3000, 'err');
      }
    }
    renderPreview();
  }
  document.getElementById('fileCamera').addEventListener('change', function (e) {
    addFilesFromInput(e.target.files); e.target.value = '';
  });
  document.getElementById('fileAlbum').addEventListener('change', function (e) {
    addFilesFromInput(e.target.files); e.target.value = '';
  });
  document.getElementById('sizeChips').addEventListener('click', function (e) {
    var chip = e.target.closest('.size-chip');
    if (!chip) return;
    uploadMaxW = parseInt(chip.getAttribute('data-w'), 10) || 1600;
    document.querySelectorAll('.size-chip').forEach(function (c) {
      c.classList.toggle('active', c === chip);
    });
  });

  document.getElementById('preview').addEventListener('click', function (e) {
    var rm = e.target.closest('.rm');
    if (rm) {
      var i = +rm.getAttribute('data-i');
      if (selectedFiles[i] && selectedFiles[i].previewUrl) URL.revokeObjectURL(selectedFiles[i].previewUrl);
      selectedFiles.splice(i, 1);
      renderPreview();
      return;
    }
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var idx = +btn.getAttribute('data-i');
    var act = btn.getAttribute('data-act');
    if (act === 'rot') {
      rotateBlob(selectedFiles[idx].blob, 90).then(function (b) {
        if (selectedFiles[idx].previewUrl) URL.revokeObjectURL(selectedFiles[idx].previewUrl);
        selectedFiles[idx].blob = b;
        selectedFiles[idx].previewUrl = URL.createObjectURL(b);
        renderPreview();
      }).catch(function (err) { toast(String(err.message || err), 3000, 'err'); });
    } else if (act === 'crop') {
      openCrop(idx);
    }
  });

  document.getElementById('cropClose').onclick = closeCrop;
  document.getElementById('cropApply').onclick = applyCrop;
  document.getElementById('cropRotL').onclick = function () {
    cropState.rot = (cropState.rot - 90 + 360) % 360; fitCropImage();
  };
  document.getElementById('cropRotR').onclick = function () {
    cropState.rot = (cropState.rot + 90) % 360; fitCropImage();
  };
  document.getElementById('cropZoomIn').onclick = function () {
    cropState.scale = Math.min(5, cropState.scale * 1.15); applyCropTransform();
  };
  document.getElementById('cropZoomOut').onclick = function () {
    cropState.scale = Math.max(0.5, cropState.scale / 1.15); applyCropTransform();
  };
  document.getElementById('cropReset').onclick = function () {
    cropState.scale = 1; cropState.x = 0; cropState.y = 0; cropState.rot = 0; fitCropImage();
  };
  document.getElementById('btnCancelSelect').onclick = exitSelectMode;
  document.getElementById('btnBatchDelete').onclick = batchDelete;

  // long-press multi-select
  (function () {
    var lpTimer = null, lpId = null;
    var grid = document.getElementById('photoGrid');
    grid.addEventListener('touchstart', function (e) {
      var item = e.target.closest('.photo-item');
      if (!item) return;
      lpId = item.getAttribute('data-id');
      lpTimer = setTimeout(function () {
        lpTimer = null;
        if (!selectMode) enterSelectMode(lpId);
        else { selectedIds[lpId] = !selectedIds[lpId]; render(); }
        if (navigator.vibrate) navigator.vibrate(20);
      }, 480);
    }, { passive: true });
    grid.addEventListener('touchmove', function () {
      if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    }, { passive: true });
    grid.addEventListener('touchend', function () {
      if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    }, { passive: true });
  })();


  document.getElementById('viewerBack').onclick = closeViewer;
  document.getElementById('viewerRotate').onclick = rotateViewer;
  document.getElementById('viewerEdit').onclick = function () {
    if (currentPhoto) openEdit(currentPhoto);
  };
  document.getElementById('viewerDelete').onclick = function () {
    if (currentPhoto) deletePhoto(currentPhoto);
  };

  document.getElementById('editClose').onclick = function () {
    document.getElementById('editModal').classList.remove('open');
    document.body.style.overflow = '';
  };
  document.getElementById('btnSaveEdit').onclick = saveEdit;

  document.getElementById('uploadModal').addEventListener('click', function (e) {
    if (e.target.id === 'uploadModal') closeUpload();
  });
  document.getElementById('editModal').addEventListener('click', function (e) {
    if (e.target.id === 'editModal') {
      document.getElementById('editModal').classList.remove('open');
      document.body.style.overflow = '';
    }
  });

  // 回到前景時重新載入，降低多分頁覆蓋風險
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && loadOk) {
      loadData();
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }

  function onOrientationChange() {
    if (!document.getElementById('viewerModal').classList.contains('open')) return;
    setTimeout(function () { vz.x = 0; vz.y = 0; applyViewerTransform(); }, 150);
  }
  window.addEventListener('orientationchange', onOrientationChange);
  window.addEventListener('resize', function () {
    if (document.getElementById('viewerModal').classList.contains('open')) onOrientationChange();
  });

  loadData();
})();
</script>
</body>
</html>
